; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
; Tell PlatformIO to prepend ccache to compiler calls
;build_flags =-fcolor-diagnostics
; Custom build script or direct executable wrapping
extra_scripts = pre:build_ccache.py
build_cache_dir = .pio/build_cache
lib_deps = 
	esphome/AsyncTCP-esphome@^2.0.1
	esphome/ESPAsyncWebServer-esphome@^3.1.0
	lennarthennigs/Button2@^2.3.1
	adafruit/RTClib@^2.1.3
	bodmer/JPEGDecoder@^2.0.0
	bodmer/TFT_eSPI@^2.5.43
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
	jgromes/RadioLib@^7.1.2
	collin80/can_common@^0.4.0
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.3.1
	robtillaart/SHT2x@^0.5.0
